backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

locale: "fr"

collections:
  - name: "blog"
    label: "Actualités"
    label_singular: "Article"
    folder: "src/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date de publication", name: "date", widget: "datetime", format: "yyyy-MM-dd" }
      - { label: "Photo principale", name: "image", widget: "image", required: false }
      - { label: "Résumé (affiché dans la liste)", name: "excerpt", widget: "text", required: false }
      - { label: "Contenu de l'article", name: "body", widget: "markdown" }

  - name: "gallery"
    label: "Galerie"
    label_singular: "Photo"
    folder: "src/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre / légende", name: "title", widget: "string", required: false }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text", required: false }
